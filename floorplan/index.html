<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>우리집 3D 배치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E7EAE8; --panel:#FFFFFF; --panel-2:#F4F6F5; --ink:#1C2326; --muted:#66727A;
  --line:#D6DCD9; --accent:#1F6F8B; --accent-ink:#FFFFFF; --danger:#B4432F;
  --scene:#E7EAE8; --ground:#D9DEDB; --shadow:0 6px 24px rgba(20,30,35,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13181A; --panel:#1E2528; --panel-2:#252D31; --ink:#E4EAEB; --muted:#93A0A6;
    --line:#323C40; --accent:#5DB3CE; --accent-ink:#0E1416; --danger:#E0775F;
    --scene:#13181A; --ground:#1B2225; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13181A; --panel:#1E2528; --panel-2:#252D31; --ink:#E4EAEB; --muted:#93A0A6;
  --line:#323C40; --accent:#5DB3CE; --accent-ink:#0E1416; --danger:#E0775F;
  --scene:#13181A; --ground:#1B2225; --shadow:0 6px 24px rgba(0,0,0,.4);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:9px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
main{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.room-label{text-align:center;color:#2b3438;pointer-events:none;text-shadow:0 0 3px rgba(255,255,255,.9)}
.room-label b{display:block;font-size:13px;font-weight:600}
.room-label i{font-style:normal;font-size:11px;opacity:.75;font-family:"IBM Plex Mono",monospace}
.dim-label{background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:6px;font-size:11px;font-family:"IBM Plex Mono",monospace;white-space:nowrap;pointer-events:none}

.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:4}
#catalog{left:12px;top:12px;bottom:12px;width:250px;display:flex;flex-direction:column;overflow:hidden}
#catalog h2,#props h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0}
.cat-head{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.cat-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.cat-list{overflow:auto;padding:4px 8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.cat-item{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px;cursor:pointer}
.cat-item:hover{border-color:var(--accent)}
.fp{height:34px;display:flex;align-items:center}
.fp i{display:block;border:1.5px solid var(--ink);border-radius:2px;opacity:.8}
.cat-item b{font-size:12.5px;font-weight:500}
.cat-item small{font-size:10.5px;color:var(--muted)}
.rooms{border-top:1px solid var(--line);padding:10px 12px 12px}
.rooms details summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.rooms .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.rooms input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:4px 8px;font-size:12.5px}

#concept{right:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.cc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#concept h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0}
#ccSeg{display:flex}
#ccSeg button{flex:1}
.cc-title{display:flex;align-items:baseline;gap:8px}
.cc-title b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.cc-title span{font-size:12px;color:var(--muted)}
.cc-line{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pal div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-width:0}
.pal i{flex:none;width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.14)}
.pal span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tips{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;line-height:1.5}
.tips dt{font-weight:600;color:var(--ink);white-space:nowrap}
.tips dd{margin:0;color:var(--muted)}
.cc-base{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
#props{right:12px;bottom:12px;width:290px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
#props .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pName{border:0;background:transparent;font-size:15px;font-weight:600;padding:2px 0;min-width:0;flex:1;border-bottom:1px dashed var(--line);border-radius:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--muted)}
.field input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 6px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .btn{padding:5px 9px}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatches button{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}

#hint{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);z-index:3;box-shadow:var(--shadow);white-space:nowrap}
#fab{display:none}
#orbit{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:3}
#orbit .btn{box-shadow:var(--shadow);padding:9px 14px;border-radius:999px}
.modal{position:fixed;inset:0;background:rgba(10,15,18,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border-radius:16px;padding:18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.modal h3{margin:0;font-size:16px}
.modal p{margin:0;color:var(--muted);line-height:1.55}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink);box-sizing:border-box}
.modal img{border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}

@media (max-width:1100px){ #hint{display:none} }
@media (max-width:760px){
  #concept{left:10px;right:10px;top:10px;width:auto;max-height:60%}
  header{padding:8px 12px}
  .brand span{display:none}
  #hint{display:none}
  #catalog{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #catalog .cat-list{grid-template-columns:repeat(3,1fr)}
  #props{left:10px;right:10px;width:auto;bottom:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #orbit{left:12px;transform:none}
  #fab{display:block;position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;box-shadow:var(--shadow);padding:10px 16px;border-radius:999px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand"><b>우리집 3D 배치</b><span id="areaInfo" class="mono"></span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="보기">
        <button id="vTop" aria-pressed="true">평면</button>
        <button id="v3d" aria-pressed="false">3D</button>
      </div>
      <div class="seg" role="group" aria-label="벽 높이">
        <button id="wFull" aria-pressed="false">벽 높게</button>
        <button id="wLow" aria-pressed="true">벽 낮게</button>
      </div>
      <button class="btn" id="undoBtn" title="되돌리기 (Ctrl+Z)">되돌리기</button>
      <button class="btn" id="shotBtn">캡처</button>
      <button class="btn" id="shareBtn">저장 코드</button>
      <button class="btn danger" id="resetBtn">초기화</button>
    </div>
  </header>
  <main>
    <div id="stage"></div>
    <div id="labels"></div>
    <div id="hint">가구 끌기: 이동 · 빈 곳 끌기: 화면 이동 · 휠/두 손가락: 확대</div>

    <section class="panel" id="catalog" aria-label="가구 목록">
      <div class="cat-head"><h2>가구 추가</h2><button class="btn" id="catClose" style="padding:3px 9px">닫기</button></div>
      <div class="cat-tabs" id="catTabs"></div>
      <div class="cat-list" id="catList"></div>
      <div class="rooms">
        <details><summary>방 이름 바꾸기</summary><div id="roomNames"></div></details>
      </div>
    </section>

    <section class="panel" id="concept" aria-label="인테리어 컨셉">
      <div class="cc-head"><h2>인테리어 컨셉</h2><button class="btn" id="ccToggle" style="padding:3px 9px">접기</button></div>
      <div class="seg" id="ccSeg" role="group" aria-label="컨셉 선택"></div>
      <div id="ccBody"></div>
    </section>

    <section class="panel" id="props" hidden aria-label="선택한 가구">
      <div class="top"><input id="pName" aria-label="가구 이름"><h2 class="mono" id="pType"></h2></div>
      <div class="grid4">
        <div class="field"><label for="pW">가로 cm</label><input id="pW" type="number" min="5" step="5"></div>
        <div class="field"><label for="pD">세로 cm</label><input id="pD" type="number" min="1" step="5"></div>
        <div class="field"><label for="pH">높이 cm</label><input id="pH" type="number" min="1" step="5"></div>
        <div class="field"><label for="pE">띄움 cm</label><input id="pE" type="number" min="0" step="5"></div>
      </div>
      <div class="row">
        <button class="btn" id="rotL" title="왼쪽 90°">⟲ 90°</button>
        <button class="btn" id="rotR" title="오른쪽 90°">⟳ 90°</button>
        <button class="btn" id="rotF" title="15° 회전">+15°</button>
        <span class="mono" id="pRot" style="color:var(--muted);font-size:12px;margin-left:auto"></span>
      </div>
      <div class="row">
        <input type="color" id="pColor" aria-label="색상">
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="row">
        <button class="btn" id="dupBtn">복제</button>
        <button class="btn danger" id="delBtn">삭제</button>
        <button class="btn" id="deselBtn" style="margin-left:auto">완료</button>
      </div>
    </section>

    <div id="orbit" hidden>
      <button class="btn" id="orbL" aria-label="왼쪽으로 돌려보기">↺ 돌려보기</button>
      <button class="btn" id="orbR" aria-label="오른쪽으로 돌려보기">돌려보기 ↻</button>
    </div>
    <button class="btn primary" id="fab">＋ 가구 추가</button>
  </main>
</div>

const S = 0.0185, CX = 203.5, CY = 462.5, WALL_H = 2.4, LOW_H = 1.0;

const KEY = 'floorplan3d_v3';
let items, rooms, concept = 'rec', ccOpen = !matchMedia('(max-width:760px)').matches;
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.items)) return s;
  }catch(e){}
  return null;
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }catch(e){} }
function snapshot(){ return { concept, items, rooms: rooms.map(r=>({id:r.id,name:r.name})) }; }
function applyState(s){
  items = s.items.map(o=>({...o}));
  concept = CONCEPTS[s.concept] ? s.concept : 'rec';
  uid = 1 + Math.max(0, ...items.map(i=>parseInt(String(i.id).slice(1))||0));
  rooms = DEFAULT_ROOMS.map(r=>({ ...r, name:(s.rooms||[]).find(x=>x.id===r.id)?.name ?? r.name }));
}
const saved = load();
applyState(saved || { concept:'rec', items: defaultItems('rec'), rooms: [] });

const history = [JSON.stringify(snapshot())];
function commit(){
  const s = JSON.stringify(snapshot());
  if (s !== history[history.length-1]) { history.push(s); if (history.length>60) history.shift(); }
  persist(); updateUndo();
}
function undo(){
  if (history.length < 2) return;
  history.pop();
  applyState(JSON.parse(history[history.length-1]));
  rebuildAll(); select(null); persist(); updateUndo(); refreshRoomLabels(); renderRoomInputs(); renderConcept();
}
const $ = id => document.getElementById(id);
function updateUndo(){ $('undoBtn').disabled = history.length < 2; }

function canvasTex(size, draw, repX, repY){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const woodTex = (w,d) => canvasTex(512,(g,n)=>{
  const rows = 8, rh = n/rows;
  for (let r=0;r<rows;r++){
    const off = (r*197)%n;
    for (let k=-1;k<2;k++){
      const l = 30 + ((r*37+k*11)%9);
      g.fillStyle = `hsl(36, 26%, ${l+40}%)`;
      g.fillRect(off + k*n, r*rh, n, rh);
      g.fillStyle = 'rgba(80,50,25,.35)'; g.fillRect(off + k*n, r*rh, 2, rh);
    }
    g.fillStyle = 'rgba(80,50,25,.28)'; g.fillRect(0, r*rh, n, 1.5);
    g.strokeStyle = 'rgba(110,70,35,.08)';
    for (let s=0;s<6;s++){ g.beginPath(); const y=r*rh+rh*(s+.5)/6; g.moveTo(0,y); g.bezierCurveTo(n*.3,y+3,n*.6,y-3,n,y); g.stroke(); }
  }
}, w/1.44, d/1.44);
const tileTex = (w,d,base,grout,sz) => canvasTex(256,(g,n)=>{
  g.fillStyle = base; g.fillRect(0,0,n,n);
  g.fillStyle = grout; for (let i=0;i<2;i++){ g.fillRect(i*n/2,0,2,n); g.fillRect(0,i*n/2,n,2); }
}, w/(sz*2), d/(sz*2));

  const [x1,y1,x2,y2, a=0, b=WALL_H, kind='wall'] = wd;

  const glass = kind==='glass';
  const geo = new THREE.BoxGeometry(r.w, 1, glass ? r.d*0.3 : r.d);
  const mesh = new THREE.Mesh(geo, glass ? glassMat : [wallSide,wallSide,wallTop,wallSide,wallSide,wallSide]);
  mesh.position.set(r.x, 0, r.z);
  mesh.castShadow = !glass; mesh.receiveShadow = true;
  mesh.userData = { a, b };
  planGroup.add(mesh); wallMeshes.push(mesh);
}
let wallMode = 'low';
function applyWalls(){
  const cap = wallMode==='low' ? LOW_H : WALL_H;
  for (const m of wallMeshes){
    const { a, b } = m.userData;
    const top = Math.min(b, cap);
    m.visible = top - a > 0.01;
    if (!m.visible) continue;
    m.scale.y = top - a; m.position.y = a + (top-a)/2;
  }
}
applyWalls();

const matCache = new Map();
function mat(color, rough=.8, extra={}){
  const k = color+'|'+rough+JSON.stringify(extra);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness:rough, ...extra }));

  const hits = ray.intersectObjects(itemsGroup.children, true);
  for (const h of hits){ const id = h.object.userData.itemId; if (id) return items.find(i=>i.id===id); }

}

  setNdc(e);
  const it = hitItem();
  if (it){
    const p = floorPoint(); if (!p) return;
    select(it);

let orbitAnim = null;
function orbitBy(deg){
  const t = controls.target, off = persp.position.clone().sub(t);
  const start = Math.atan2(off.x, off.z), r = Math.hypot(off.x, off.z), end = start + deg*Math.PI/180;
  const t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion:reduce)').matches ? 1 : 350;
  cancelAnimationFrame(orbitAnim);
  const step = now => {
    const k = Math.min(1, (now-t0)/dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2, a = start + (end-start)*e;
    persp.position.set(t.x + Math.sin(a)*r, persp.position.y, t.z + Math.cos(a)*r);
    persp.lookAt(t);
    if (k<1) orbitAnim = requestAnimationFrame(step);
  };
  orbitAnim = requestAnimationFrame(step);
}

let fitted = false;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w,h); labelRenderer.setSize(w,h);
  persp.aspect = w/h; persp.updateProjectionMatrix();
  // 세로로 긴 폰 화면에서도 집 전체가 들어오도록 처음 한 번만 카메라를 뒤로 뺀다
  if (!fitted && w>0 && h>0){
    fitted = true;
    const f = Math.max(1, 1.15/(w/h));
    persp.position.sub(controls.target).multiplyScalar(f).add(controls.target);
    controls.maxDistance = Math.max(22, persp.position.distanceTo(controls.target)*1.5);
  }
  const planW = 7.2, planH = 6.8, a = w/h;
  let hh = Math.max(planH/2, planW/2/a);
  // 왼쪽 가구 패널에 도면이 가리지 않도록 평면 시점을 옆으로 비켜 둔다
  const leftPx = (!isSmall() && !$('catalog').hidden) ? 262 : 0;
  const rightPx = (!isSmall() && ccOpen) ? 312 : 0;
  hh = Math.max(hh, (planW/2) / ((w-leftPx-rightPx)/h));
  const shift = ((leftPx-rightPx)/2)/w * 2*hh*a;
  ortho.left=-hh*a-shift; ortho.right=hh*a-shift; ortho.top=hh; ortho.bottom=-hh; ortho.updateProjectionMatrix();
}

function fillProps(){
  const it = selected; if (!it) return;
  $('pName').value = it.name; $('pType').textContent = TYPE_KR[it.type]||it.type;
  $('pW').value = cm(it.w); $('pD').value = cm(it.d); $('pH').value = cm(it.h); $('pE').value = cm(it.elev||0);
  $('pColor').value = it.color; $('pRot').textContent = `${((it.rot%360)+360)%360}°`;
}
function onDim(key, id, min){
  $(id).addEventListener('change', ()=>{
    if (!selected) return;
    const v = parseFloat($(id).value); if (!(v>=min)) { fillProps(); return; }
    selected[key] = v/100; buildItem(selected); updateSelVisual(); commit();
  });
}
onDim('w','pW',5); onDim('d','pD',1); onDim('h','pH',1); onDim('elev','pE',0);
$('pName').addEventListener('change', ()=>{ if (selected){ selected.name = $('pName').value.trim() || TYPE_KR[selected.type]; commit(); } });
$('pColor').addEventListener('input', ()=>{ if (selected){ selected.color = $('pColor').value; buildItem(selected); } });
$('pColor').addEventListener('change', ()=>commit());
$('swatches').innerHTML = SWATCHES.map(c=>`<button style="background:${c}" data-c="${c}" aria-label="색상 ${c}"></button>`).join('');
$('swatches').addEventListener('click', e=>{ const c=e.target.dataset.c; if (c && selected){ selected.color=c; buildItem(selected); fillProps(); commit(); } });
function rotate(deg){ if (!selected) return; selected.rot = (((selected.rot+deg)%360)+360)%360; placeItem(selected); updateSelVisual(); fillProps(); commit(); }
$('rotL').onclick = ()=>rotate(-90); $('rotR').onclick = ()=>rotate(90); $('rotF').onclick = ()=>rotate(15);
function duplicate(){
  if (!selected) return;
  const c = { ...selected, id:'i'+(uid++), x:selected.x+.3, z:selected.z+.3 };
  items.push(c); buildItem(c); select(c); commit();
}
function remove(){
  if (!selected) return;
  const g = meshById.get(selected.id); itemsGroup.remove(g); disposeGroup(g); meshById.delete(selected.id);
  items = items.filter(i=>i!==selected); select(null); commit();
}
$('dupBtn').onclick = duplicate; $('delBtn').onclick = remove; $('deselBtn').onclick = ()=>select(null);
$('undoBtn').onclick = undo; updateUndo();

addEventListener('keydown', e=>{
  if (e.target.closest('input,textarea')) return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if (!selected) return;
  const step = e.shiftKey ? .01 : .05;
  const k = e.key;
  if (k==='r'||k==='R'){ rotate(e.shiftKey?-90:90); }
  else if (k==='Delete'||k==='Backspace'){ e.preventDefault(); remove(); }
  else if ((e.ctrlKey||e.metaKey) && k.toLowerCase()==='d'){ e.preventDefault(); duplicate(); }
  else if (k==='Escape'){ select(null); }
  else if (k.startsWith('Arrow')){
    e.preventDefault();
    if (k==='ArrowLeft') selected.x-=step; if (k==='ArrowRight') selected.x+=step;
    if (k==='ArrowUp') selected.z-=step; if (k==='ArrowDown') selected.z+=step;
    placeItem(selected); updateSelVisual(); commit();
  }
});

/* ───────── 카탈로그 ───────── */
let cat = CATS[0];
function renderCatalog(){
  $('catTabs').innerHTML = CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${c}">${c}</button>`).join('');
  $('catList').innerHTML = CATALOG.map((c,i)=>[c,i]).filter(([c])=>c[0]===cat).map(([c,i])=>{
    const k = 0.14; // 1px = 약 7cm
    return `<button class="cat-item" data-i="${i}">
      <span class="fp"><i style="width:${Math.max(4,c[3]*k)}px;height:${Math.max(3,c[4]*k)}px;background:${c[6]}"></i></span>
      <b>${c[2]}</b><small class="mono">${c[3]}×${c[4]}×${c[5]}</small></button>`;
  }).join('');
}
$('catTabs').addEventListener('click', e=>{ const c=e.target.dataset.cat; if (c){ cat=c; renderCatalog(); } });
$('catList').addEventListener('click', e=>{
  const b = e.target.closest('.cat-item'); if (!b) return;
  const [,type,name,w,d,h,color,elev=0] = CATALOG[+b.dataset.i];
  const t = activeControls.target;
  const it = mk(type,name, snap(Math.max(-2.5,Math.min(2.5,t.x))), snap(Math.max(-2.5,Math.min(2.5,t.z))), w/100,d/100,h/100,0,color,elev/100);
  items.push(it); buildItem(it); select(it); commit();
});
renderCatalog();

function renderRoomInputs(){
  $('roomNames').innerHTML = rooms.map(r=>`<div class="row"><input data-room="${r.id}" aria-label="${r.name} 이름"></div>`).join('');
  $('roomNames').querySelectorAll('input').forEach(inp=>{ inp.value = rooms.find(r=>r.id===inp.dataset.room).name; });
}
$('roomNames').addEventListener('change', e=>{
  const r = rooms.find(x=>x.id===e.target.dataset.room); if (!r) return;
  r.name = e.target.value.trim() || DEFAULT_ROOMS.find(x=>x.id===r.id).name; refreshRoomLabels(); commit();
});
renderRoomInputs();

/* ───────── 모바일 시트 ───────── */
const isSmall = () => matchMedia('(max-width:760px)').matches;
function syncFab(){ $('fab').hidden = !isSmall() || !$('catalog').hidden || !$('props').hidden; }
function layoutMode(){
  $('catalog').hidden = isSmall(); resize();
  $('catClose').hidden = !isSmall();
  syncFab();
}
$('fab').onclick = ()=>{ select(null); $('catalog').hidden = false; syncFab(); };
$('catClose').onclick = ()=>{ $('catalog').hidden = true; syncFab(); };
matchMedia('(max-width:760px)').addEventListener('change', layoutMode);
layoutMode();

/* ───────── 모달 (캡처 · 저장 코드 · 초기화) ───────── */
function modal(html){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('click', e=>{ if (e.target===m || e.target.dataset.close!==undefined) m.remove(); });
  document.body.appendChild(m); return m;
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }
$('shotBtn').onclick = ()=>{
  const was = selected; select(null); renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  select(was);
  modal(`<h3>현재 화면</h3><p>이미지를 길게 누르거나 우클릭해서 저장하세요.</p><img alt="3D 배치 캡처" src="${url}"><div class="row"><button class="btn" data-close style="margin-left:auto">닫기</button></div>`);
};
$('shareBtn').onclick = ()=>{
  const m = modal(`<h3>저장 코드</h3><p>배치는 이 브라우저에 자동 저장돼요. 다른 기기로 옮기거나 여러 안을 비교하려면 아래 코드를 복사해 두었다가 붙여넣고 <b>불러오기</b>를 누르세요.</p>
    <textarea id="codeBox" spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="copyCode">복사</button><button class="btn primary" id="loadCode">불러오기</button><button class="btn" data-close style="margin-left:auto">닫기</button></div>`);
  const box = m.querySelector('#codeBox'); box.value = JSON.stringify(snapshot());
  m.querySelector('#copyCode').onclick = ()=>{
    navigator.clipboard?.writeText(box.value).then(()=>toast('복사했어요'), ()=>{ box.select(); toast('선택된 코드를 복사하세요'); }) ?? (box.select());
  };
  m.querySelector('#loadCode').onclick = ()=>{
    try{
      const s = JSON.parse(box.value); if (!Array.isArray(s.items)) throw 0;
      applyState(s); rebuildAll(); select(null); refreshRoomLabels(); renderRoomInputs(); renderConcept(); commit(); m.remove(); toast('불러왔어요');
    }catch(e){ toast('코드 형식이 올바르지 않아요'); }
  };
};
$('resetBtn').onclick = ()=>{
  const m = modal(`<h3>처음 배치로 되돌릴까요?</h3><p>지금 배치한 가구가 모두 이 컨셉의 기본 배치로 바뀝니다. 되돌리기 버튼으로 다시 복구할 수 있어요.</p>
    <div class="row"><button class="btn danger" id="doReset">초기화</button><button class="btn" data-close style="margin-left:auto">취소</button></div>`);
  m.querySelector('#doReset').onclick = ()=>{
    applyState({ concept, items: defaultItems(concept), rooms: [] }); rebuildAll(); select(null); refreshRoomLabels(); renderRoomInputs(); commit(); m.remove();
  };
};

/* ───────── 컨셉 패널 ───────── */
function renderConcept(){
  const C = CONCEPTS[concept];
  $('ccSeg').innerHTML = CONCEPT_ORDER.map(id=>`<button data-cc="${id}" aria-pressed="${id===concept}">${CONCEPTS[id].name}</button>`).join('');
  const sw = ([n,c]) => `<div><i style="background:${c}"></i><span>${n}</span></div>`;
  $('ccBody').hidden = !ccOpen;
  $('ccToggle').textContent = ccOpen ? '접기' : '펼치기';
  $('ccBody').innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">
    <div class="cc-title"><b>${C.title}</b><span>${C.name}</span></div>
    <p class="cc-line">${C.line}</p>
    <div class="pal">${C.palette.map(sw).join('')}</div>
    <dl class="tips">${C.tips.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="cc-base">그대로 두는 것 · <span class="mono">${BASE_TONES.map(([n])=>n).join(' · ')}</span></div>
  </div>`;
}
$('ccSeg').addEventListener('click', e=>{
  const id = e.target.dataset.cc; if (!id || id===concept) return;
  concept = id;
  items = defaultItems(id); rebuildAll(); select(null); commit(); renderConcept();
  toast(`${CONCEPTS[id].name} 컨셉을 적용했어요 · 되돌리기로 이전 배치 복구`);
});
$('ccToggle').onclick = ()=>{ ccOpen = !ccOpen; renderConcept(); resize(); };
renderConcept(); resize();

/* ───────── 렌더 루프 ───────── */
setView('top');
renderer.setAnimationLoop(()=>{
  activeControls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
